name: kind
on:
  workflow_dispatch:
    inputs:
      orka_ref:
        description: Exact Orka branch, tag, or commit
        default: main
        required: true
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install kind
        run: |
          source versions.env
          curl -fsSLo "${RUNNER_TEMP}/kind" "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          printf '%s  %s\n' "${KIND_LINUX_AMD64_SHA256}" "${RUNNER_TEMP}/kind" | sha256sum -c -
          sudo install "${RUNNER_TEMP}/kind" /usr/local/bin/kind
      - name: Install Helm
        run: |
          source versions.env
          curl -fsSLo "${RUNNER_TEMP}/helm.tar.gz" "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          printf '%s  %s\n' "${HELM_LINUX_AMD64_SHA256}" "${RUNNER_TEMP}/helm.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/helm.tar.gz" -C "${RUNNER_TEMP}" linux-amd64/helm
          sudo install "${RUNNER_TEMP}/linux-amd64/helm" /usr/local/bin/helm
      - name: Validate Kontxt against candidate Orka
        env:
          ORKA_REF: ${{ inputs.orka_ref || 'main' }}
        run: scripts/kind-ci.sh
